; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino

; Slower, more reliable speeds for clone USB-serial chips (CH340/CP2102
; knockoffs) that flake out at PlatformIO's auto-detected 921600 upload
; speed -- this is a common cause of an upload that reports success (or
; fails silently) but leaves the board not actually running new firmware.
upload_speed = 115200
monitor_speed = 115200
